<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumexa Store — Administração</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand">LUMEXA <span>ADMIN</span></div><button id="logout">Sair</button></header><main style="padding:30px 6%"><h1>Painel de administração</h1><p>Produtos, disponibilidade e pedidos.</p>
<section class="panel" style="width:100%;max-width:900px;margin:20px 0"><h2>Novo / editar produto</h2><input id="id" type="hidden"><input id="name" placeholder="Nome"><input id="category" placeholder="Categoria"><input id="price" type="number" placeholder="Preço em AOA"><input id="image" placeholder="URL da imagem"><textarea id="description" placeholder="Descrição" style="width:100%;margin-top:10px;padding:14px;border:1px solid #ddd;border-radius:12px;min-height:100px"></textarea><label style="display:block;margin:12px 0"><input id="available" type="checkbox" checked> Disponível</label><button id="save">Guardar produto</button> <button class="ghost" id="clear">Limpar</button></section>
<h2>Produtos</h2><div id="list" class="grid"></div><h2>Pedidos recentes</h2><div id="orders"></div></main><script src="/admin.js"></script></body></html>
