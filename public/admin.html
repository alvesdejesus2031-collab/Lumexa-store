<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lumexa Store — Administração</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header>
  <div class="brand">
    LUMEXA <span>ADMIN</span>
  </div>

  <button id="logout">
    Sair
  </button>
</header>

<main style="padding:30px 6%">

  <h1>Painel de administração</h1>

  <p>
    Produtos, disponibilidade e pedidos.
  </p>

  <section
    class="panel"
    style="width:100%;max-width:900px;margin:20px 0"
  >

    <h2>Novo / editar produto</h2>

    <input id="id" type="hidden">

    <input
      id="name"
      placeholder="Nome do produto"
    >

    <input
      id="category"
      placeholder="Categoria"
    >

    <input
      id="price"
      type="number"
      min="0"
      placeholder="Preço em AOA"
    >

    <label style="display:block;margin:15px 0">

      Imagem do produto:

      <input
        id="imageFile"
        type="file"
        accept="image/*"
        style="display:block;margin-top:8px"
      >

    </label>

    <img
      id="imagePreview"
      alt="Pré-visualização"
      style="
        display:none;
        width:160px;
        height:160px;
        object-fit:cover;
        border-radius:14px;
        margin:10px 0;
      "
    >

    <textarea
      id="description"
      placeholder="Descrição do produto"
      style="
        width:100%;
        margin-top:10px;
        padding:14px;
        border:1px solid #ddd;
        border-radius:12px;
        min-height:100px;
      "
    ></textarea>

    <label style="display:block;margin:12px 0">

      <input
        id="available"
        type="checkbox"
        checked
      >

      Disponível

    </label>

    <button id="save">
      Guardar produto
    </button>

    <button
      class="ghost"
      id="clear"
      type="button"
    >
      Limpar
    </button>

    <p
      id="message"
      style="margin-top:12px"
    ></p>

  </section>

  <h2>Produtos</h2>

  <div
    id="list"
    class="grid"
  ></div>

  <h2>Pedidos recentes</h2>

  <div id="orders"></div>

</main>

<script src="/admin.js"></script>

</body>
</html>
