<!doctype html>
<html lang="pt">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="description"
    content="Lumexa — roupa, calçado e acessórios escolhidos com cuidado. Escolhe e envia o teu pedido pelo WhatsApp."
  >

  <meta name="theme-color" content="#F9F8F4">

  <title>Lumexa</title>

  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:wght@400;700&display=swap"
  >

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

<noscript><style>#welcome{display:none}</style></noscript>

<div id="welcome" role="status" aria-live="polite">
  <img src="/logo-header.png" alt="Lumexa" width="147" height="102">
  <p>Bem-vindo à Lumexa</p>
  <span class="bar" aria-hidden="true"></span>
</div>

<header>

  <a class="brand" href="/">
    <img src="/logo-header.png" alt="Lumexa" width="92" height="64">
  </a>

  <button
    id="adminBtn"
    class="ghost"
    type="button"
  >
    Administrador
  </button>

</header>

<main>

  <section class="hero">

    <div>

      <h1>
        O teu estilo. As tuas escolhas. A tua Lumexa.
      </h1>

      <p>
        Roupa, calçado e acessórios escolhidos com cuidado.
        Escolhe o que gostas e envia o pedido pelo WhatsApp.
      </p>

      <button
        id="viewProducts"
        type="button"
      >
        Ver produtos
      </button>

    </div>

  </section>

  <section class="toolbar">

    <input
      id="search"
      placeholder="Pesquisar produto…"
    >

    <select id="cat">

      <option value="">
        Todas as categorias
      </option>

    </select>

  </section>

  <section
    id="products"
    class="grid"
  ></section>

</main>

<div
  id="cart"
  class="cart"
>

  <div class="cartHead">

    <h2>
      Seu pedido
    </h2>

    <button
      id="closeCart"
      type="button"
    >
      ×
    </button>

  </div>

  <div id="cartItems"></div>

  <div
    class="total"
    id="total"
  ></div>

  <input
    id="customerName"
    placeholder="Seu nome"
  >

  <input
    id="customerPhone"
    placeholder="Seu telefone"
  >

  <button
    id="orderBtn"
    type="button"
  >
    Enviar pedido pelo WhatsApp
  </button>

</div>

<div
  id="modal"
  class="modal hidden"
>

  <div class="panel">

    <button
      class="close"
      id="closeModal"
      type="button"
    >
      ×
    </button>

    <h2>
      Área do administrador
    </h2>

    <p class="muted">
      Acesso privado.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email do administrador"
    >

    <input
      id="password"
      type="password"
      placeholder="Senha"
    >

    <input
      id="code"
      placeholder="Código 2FA (se ativado)"
    >

    <button
      id="login"
      type="button"
    >
      Entrar
    </button>

    <p id="loginMsg"></p>

  </div>

</div>

<footer>
  Lumexa · Loja online
</footer>

<script>
(function () {
  var welcome = document.getElementById("welcome");
  var list = document.getElementById("products");
  function hide() {
    if (!welcome) return;
    welcome.classList.add("done");
    setTimeout(function () { welcome.remove(); welcome = null; }, 600);
  }
  // esconde assim que aparecer o primeiro produto na lista
  if (list) {
    new MutationObserver(function (m, obs) {
      if (list.children.length) { obs.disconnect(); hide(); }
    }).observe(list, { childList: true });
  }
  // segurança: nunca fica preso mais de 10 segundos
  setTimeout(hide, 10000);
})();
</script>

<script src="/app.js"></script>

</body>

</html>
