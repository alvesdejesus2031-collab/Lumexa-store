<!doctype html>
<html lang="pt">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="description"
    content="Lumexa Store — loja online de várias categorias."
  >

  <title>Lumexa Store</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

<header>

  <div class="brand">
    LUMEXA <span>STORE</span>
  </div>

  <button
    id="adminBtn"
    class="ghost"
    type="button"
  >
    Administrador
  </button>

</header>

<main>

  <section class="hero">

    <div>

      <p class="eyebrow">
        LUMEXA STORE
      </p>

      <h1>
        Encontra. Escolhe. Compra.
      </h1>

      <p>
        Uma loja de várias categorias,
        com produtos disponíveis e novidades.
      </p>

      <button
        id="viewProducts"
        type="button"
      >
        Ver produtos
      </button>

    </div>

  </section>

  <section class="toolbar">

    <input
      id="search"
      placeholder="Pesquisar produto…"
    >

    <select id="cat">

      <option value="">
        Todas as categorias
      </option>

    </select>

  </section>

  <section
    id="products"
    class="grid"
  ></section>

</main>

<div
  id="cart"
  class="cart"
>

  <div class="cartHead">

    <h2>
      Seu pedido
    </h2>

    <button
      id="closeCart"
      type="button"
    >
      ×
    </button>

  </div>

  <div id="cartItems"></div>

  <div
    class="total"
    id="total"
  ></div>

  <input
    id="customerName"
    placeholder="Seu nome"
  >

  <input
    id="customerPhone"
    placeholder="Seu telefone"
  >

  <button
    id="orderBtn"
    type="button"
  >
    Enviar pedido pelo WhatsApp
  </button>

</div>

<div
  id="modal"
  class="modal hidden"
>

  <div class="panel">

    <button
      class="close"
      id="closeModal"
      type="button"
    >
      ×
    </button>

    <h2>
      Área do administrador
    </h2>

    <p class="muted">
      Acesso privado.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email do administrador"
    >

    <input
      id="password"
      type="password"
      placeholder="Senha"
    >

    <input
      id="code"
      placeholder="Código 2FA (se ativado)"
    >

    <button
      id="login"
      type="button"
    >
      Entrar
    </button>

    <p id="loginMsg"></p>

  </div>

</div>

<footer>
  Lumexa Store · Loja online de várias categorias
</footer>

<script src="/app.js"></script>

</body>

</html>
